<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜歌词 · MUSIC QUIZ</title>
    <style>
        /* ===== 设计令牌 · 明亮活力风 ===== */
        :root {
            --bg:        #f4f0ff;
            --bg2:       #eef6ff;
            --surface:   rgba(255,255,255,0.72);
            --border:    rgba(120,90,220,0.15);
            --cyan:      #06b6d4;
            --purple:    #7c3aed;
            --pink:      #ec4899;
            --gold:      #f59e0b;
            --text:      #1e1b4b;
            --text-dim:  #6b7280;
            --hit-bg:    rgba(124,58,237,0.10);
            --hit-color: #7c3aed;
            --hidden-bg: rgba(124,58,237,0.12);
            --pre-color: rgba(30,27,75,0.45);
            --glow-c:    0 0 14px rgba(6,182,212,0.35);
            --glow-p:    0 0 14px rgba(124,58,237,0.35);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'PingFang SC','Microsoft YaHei','微软雅黑',sans-serif;
            min-height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            overflow-x: hidden;
        }

        /* ===== 动态背景 · 彩色光斑 ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 40% at 15% 5%,  rgba(124,58,237,.18) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 85% 85%, rgba(6,182,212,.16)  0%, transparent 70%),
                radial-gradient(ellipse 45% 35% at 55% 40%, rgba(236,72,153,.12) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 50% 90%, rgba(245,158,11,.10) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            from { opacity: .6; }
            to   { opacity: 1; }
        }

        /* 纹理 */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='.6' fill='rgba(124,58,237,.06)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 通用层级 ===== */
        #themeScreen, #gameScreen, .toast, .overlay { position: relative; z-index: 1; }

        /* ========================================
           主题选择页
        ======================================== */
        #themeScreen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 40px;
        }
        #gameScreen { display: none; }

        /* --- Hero 区 --- */
        .theme-hero {
            text-align: center;
            padding: 52px 20px 32px;
        }
        .hero-logo {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }
        .hero-logo-icon {
            font-size: 64px;
            display: block;
            filter: drop-shadow(0 6px 20px rgba(124,58,237,.45));
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-8px); }
        }
        /* 均衡器条 */
        .eq-bars {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 28px;
            margin-bottom: 18px;
        }
        .eq-bar {
            width: 4px;
            border-radius: 2px;
            background: linear-gradient(to top, var(--cyan), var(--purple));
            animation: eqAnim 1.2s ease-in-out infinite alternate;
        }
        .eq-bar:nth-child(1){ height:40%; animation-delay:0s; }
        .eq-bar:nth-child(2){ height:70%; animation-delay:.1s; }
        .eq-bar:nth-child(3){ height:100%;animation-delay:.2s; }
        .eq-bar:nth-child(4){ height:55%; animation-delay:.15s;}
        .eq-bar:nth-child(5){ height:85%; animation-delay:.05s;}
        .eq-bar:nth-child(6){ height:45%; animation-delay:.25s;}
        .eq-bar:nth-child(7){ height:75%; animation-delay:.1s; }
        @keyframes eqAnim {
            from { transform: scaleY(0.3); opacity:.6; }
            to   { transform: scaleY(1);   opacity:1; }
        }

        .theme-hero-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--cyan) 0%, var(--purple) 50%, var(--pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .theme-hero-sub {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        /* --- 专场卡片网格 --- */
        .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 0 16px;
        }
        .theme-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px 14px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s, border-color .2s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(124,58,237,.08);
        }
        .theme-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(124,58,237,.08), rgba(236,72,153,.06));
            opacity: 0;
            transition: opacity .2s;
        }
        .theme-card:hover::before { opacity: 1; }
        .theme-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--purple);
            box-shadow: 0 12px 28px rgba(124,58,237,.22), 0 0 0 1px rgba(124,58,237,.15);
        }
        .theme-card:active { transform: scale(.97); }

        .theme-card-icon  { font-size: 38px; margin-bottom: 10px; display: block;
                            filter: drop-shadow(0 4px 8px rgba(124,58,237,.25)); }
        .theme-card-name  { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 5px;
                            letter-spacing: .5px; }
        .theme-card-desc  { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
        .theme-card-count {
            display: inline-block;
            font-size: 10px;
            padding: 3px 11px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(124,58,237,.12), rgba(236,72,153,.12));
            color: var(--purple);
            border: 1px solid rgba(124,58,237,.25);
            font-weight: 600;
            letter-spacing: .5px;
        }

        /* ========================================
           游戏页
        ======================================== */

        /* --- 顶栏 --- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255,255,255,.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(124,58,237,.08);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-dim);
            font-size: 12px;
            padding: 5px 12px;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }
        .back-btn:hover {
            color: var(--purple);
            border-color: var(--purple);
            background: rgba(124,58,237,.14);
        }

        .theme-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(124,58,237,.14), rgba(236,72,153,.14));
            border: 1px solid rgba(124,58,237,.3);
            color: var(--purple);
            letter-spacing: .5px;
        }

        .guess-count-pill {
            font-size: 11px;
            color: var(--text-dim);
        }
        .guess-count-pill span {
            font-size: 14px;
            font-weight: 700;
            color: var(--gold);
        }

        /* --- 输入区 --- */
        .input-row {
            display: flex;
            gap: 10px;
            padding: 14px 16px;
            align-items: center;
        }
        .guess-input {
            flex: 1;
            height: 46px;
            padding: 0 18px;
            background: rgba(255,255,255,.85);
            border: 1.5px solid var(--border);
            border-radius: 23px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            box-shadow: 0 2px 8px rgba(124,58,237,.06);
        }
        .guess-input::placeholder { color: var(--text-dim); }
        .guess-input:focus {
            border-color: var(--purple);
            box-shadow: var(--glow-p), 0 2px 12px rgba(124,58,237,.15);
        }
        .guess-input.shake { animation: shake .35s; }
        @keyframes shake {
            0%,100%{ transform:translateX(0); }
            20%    { transform:translateX(-7px); }
            40%    { transform:translateX(7px); }
            60%    { transform:translateX(-4px); }
            80%    { transform:translateX(4px); }
        }
        .submit-btn {
            height: 46px;
            padding: 0 22px;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            color: #fff;
            border: none;
            border-radius: 23px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 6px 18px rgba(124,58,237,.35);
            transition: opacity .15s, transform .1s;
            letter-spacing: 1px;
        }
        .submit-btn:active { opacity:.85; transform:scale(.96); }

        /* --- 歌曲信息卡 --- */
        .song-section {
            margin: 0 16px 10px;
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(8px);
            position: relative;
            box-shadow: 0 4px 16px rgba(124,58,237,.06);
        }
        .song-section-label {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .hint-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, rgba(245,158,11,.18), rgba(236,72,153,.18));
            border: 1px solid rgba(245,158,11,.4);
            border-radius: 14px;
            color: var(--gold);
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: .5px;
            transition: box-shadow .2s, color .2s;
        }
        .hint-btn:hover {
            box-shadow: 0 0 14px rgba(245,158,11,.35);
            color: #b45309;
        }
        .hint-btn:active { opacity:.8; }

        .song-meta-line {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            min-height: 26px;
        }
        .song-meta-line + .song-meta-line { margin-top: 6px; }

        .meta-label {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: .5px;
            width: 32px;
            flex-shrink: 0;
        }
        .meta-ch {
            width: 20px;
            height: 20px;
            font-size: 12px;
            border-radius: 4px;
            margin: 1px;
        }
        .meta-sep {
            color: var(--text-dim);
            font-size: 13px;
            margin: 0 2px;
        }

        /* --- 进度条 --- */
        .progress-wrap {
            padding: 4px 16px 10px;
        }
        .progress-bg {
            height: 4px;
            background: rgba(124,58,237,.10);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fg {
            height: 100%;
            background: linear-gradient(to right, var(--cyan), var(--purple), var(--pink));
            border-radius: 4px;
            transition: width .5s ease;
            box-shadow: 0 0 8px rgba(124,58,237,.5);
        }
        .progress-text {
            font-size: 10px;
            color: var(--text-dim);
            text-align: right;
            margin-top: 4px;
            letter-spacing: .5px;
        }
        .progress-text b { color: var(--purple); font-weight: 700; }

        /* --- 歌词区 --- */
        .lyrics-area {
            padding: 4px 16px 50px;
        }
        .lyric-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 3px;
            margin: 6px 0;
            min-height: 30px;
        }
        .ch {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            font-size: 14px;
            border-radius: 5px;
            font-weight: 500;
            transition: background .3s, color .3s, box-shadow .3s;
        }
        .ch.hidden {
            background: var(--hidden-bg);
            border: 1px solid rgba(124,58,237,.18);
        }
        .ch.pre {
            background: transparent;
            color: var(--pre-color);
            font-weight: 600;
        }
        .ch.revealed {
            background: linear-gradient(135deg, rgba(124,58,237,.18), rgba(236,72,153,.18));
            color: var(--purple);
            font-weight: 800;
            border: 1px solid rgba(124,58,237,.35);
            box-shadow: 0 2px 8px rgba(124,58,237,.2);
            animation: revealPop .25s ease;
        }
        @keyframes revealPop {
            0%  { transform: scale(1.4); opacity:.6; }
            100%{ transform: scale(1);   opacity:1; }
        }
        .ch.space { background: transparent; width: 6px; border: none; }

        /* --- 加载动画 --- */
        .loading-wrap {
            display: none;
            text-align: center;
            padding: 50px 0;
            color: var(--text-dim);
            font-size: 13px;
        }
        .loading-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1s infinite;
        }
        .loading-dot:nth-child(1){ background: var(--cyan);   animation-delay:0s; }
        .loading-dot:nth-child(2){ background: var(--purple); animation-delay:.15s; }
        .loading-dot:nth-child(3){ background: var(--pink);   animation-delay:.30s; }
        @keyframes bounce {
            0%,80%,100%{ transform:translateY(0);    opacity:.4; }
            40%         { transform:translateY(-10px); opacity:1; }
        }

        /* --- 底部提示 --- */
        .footer-tip {
            text-align: center;
            font-size: 10px;
            color: rgba(107,114,128,.7);
            padding: 0 16px 24px;
            letter-spacing: .5px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            border-radius: 0 0 14px 14px;
            font-size: 13px;
            font-weight: 700;
            z-index: 500;
            display: none;
            max-width: 90vw;
            text-align: center;
            letter-spacing: .5px;
            backdrop-filter: blur(12px);
        }
        .toast.ok  {
            background: rgba(255,255,255,.95);
            color: var(--purple);
            border: 1px solid rgba(124,58,237,.3);
            border-top: none;
            box-shadow: 0 6px 20px rgba(124,58,237,.2);
        }
        .toast.err {
            background: rgba(255,255,255,.95);
            color: #dc2626;
            border: 1px solid rgba(220,38,38,.3);
            border-top: none;
            box-shadow: 0 6px 20px rgba(220,38,38,.18);
        }
        .toast.tip {
            background: rgba(255,255,255,.95);
            color: var(--gold);
            border: 1px solid rgba(245,158,11,.4);
            border-top: none;
            box-shadow: 0 6px 20px rgba(245,158,11,.2);
        }

        /* ===== 胜利弹窗 ===== */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(244,240,255,.6);
            backdrop-filter: blur(10px);
            z-index: 400;
            align-items: center;
            justify-content: center;
        }
        .overlay.show { display: flex; }
        .win-box {
            background: #fff;
            border: 1px solid rgba(124,58,237,.2);
            border-radius: 24px;
            padding: 36px 32px 28px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            animation: winPop .35s cubic-bezier(.34,1.56,.64,1);
            box-shadow: 0 20px 60px rgba(124,58,237,.25), 0 0 0 1px rgba(236,72,153,.10);
            position: relative;
            overflow: hidden;
        }
        .win-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at top, rgba(124,58,237,.10) 0%, transparent 60%),
                radial-gradient(ellipse at bottom, rgba(236,72,153,.06) 0%, transparent 60%);
            pointer-events: none;
        }
        @keyframes winPop {
            from { transform:scale(.8) translateY(20px); opacity:0; }
            to   { transform:scale(1) translateY(0);     opacity:1; }
        }
        .win-emoji {
            font-size: 52px;
            margin-bottom: 10px;
            display: block;
            animation: winBounce .6s ease .1s both;
        }
        @keyframes winBounce {
            0%  { transform:scale(0) rotate(-20deg); }
            70% { transform:scale(1.15) rotate(5deg); }
            100%{ transform:scale(1) rotate(0); }
        }
        .win-title {
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--purple);
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 700;
            position: relative;
        }
        .win-song {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 8px 0 2px;
            position: relative;
        }
        .win-info {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 20px;
            position: relative;
        }
        .win-stats {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            background: linear-gradient(135deg, rgba(124,58,237,.08), rgba(236,72,153,.06));
            border: 1px solid rgba(124,58,237,.15);
            border-radius: 14px;
            padding: 16px 0;
            position: relative;
        }
        .win-stat-item { flex: 1; text-align: center; }
        .win-stat-divider { width: 1px; height: 36px; background: rgba(124,58,237,.18); }
        .stat-num {
            font-size: 30px;
            font-weight: 900;
            color: var(--purple);
            line-height: 1.1;
            text-shadow: 0 2px 12px rgba(124,58,237,.25);
        }
        .stat-label { font-size: 10px; color: var(--text-dim); margin-top: 4px; letter-spacing: .5px; }

        .win-actions { display: flex; gap: 10px; position: relative; }
        .next-btn {
            flex: 1;
            padding: 13px 0;
            background: linear-gradient(135deg, var(--purple), var(--pink));
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(124,58,237,.35);
            transition: opacity .15s, transform .1s;
            letter-spacing: .5px;
        }
        .next-btn:active { opacity:.85; transform:scale(.97); }
        .back-theme-btn {
            flex: 1;
            padding: 13px 0;
            background: transparent;
            border: 1.5px solid rgba(124,58,237,.3);
            border-radius: 14px;
            color: var(--purple);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }
        .back-theme-btn:hover { background: rgba(124,58,237,.08); border-color: var(--purple); }
    </style>
</head>
<body>

<!-- ========== 主题选择页 ========== -->
<div id="themeScreen">
    <div class="theme-hero">
        <div class="hero-logo">
            <span class="hero-logo-icon">🎵</span>
        </div>
        <div class="eq-bars">
            <div class="eq-bar"></div><div class="eq-bar"></div>
            <div class="eq-bar"></div><div class="eq-bar"></div>
            <div class="eq-bar"></div><div class="eq-bar"></div>
            <div class="eq-bar"></div>
        </div>
        <div class="theme-hero-title">猜歌词</div>
        <div class="theme-hero-sub">MUSIC QUIZ · 选择专场，开始挑战</div>
    </div>
    <div class="theme-grid" id="themeGrid"></div>
</div>

<!-- ========== 游戏页 ========== -->
<div id="gameScreen">
    <div class="header">
        <button class="back-btn" onclick="goHome()">← 返回</button>
        <span class="theme-badge" id="themeBadge"></span>
        <div class="guess-count-pill">×<span id="guessCount">0</span></div>
    </div>

    <div class="input-row">
        <input id="guessInput" class="guess-input"
               placeholder="输入字符揭示歌词…"
               autocomplete="off" maxlength="20" />
        <button class="submit-btn" onclick="handleGuess()">猜</button>
    </div>

    <div class="song-section">
        <div class="song-section-label">歌曲信息</div>
        <button class="hint-btn" onclick="useHint()">💡 提示 +2</button>
        <div class="song-meta-line">
            <span class="meta-label">歌名</span>
            <span id="songNameBlocks"></span>
        </div>
        <div class="song-meta-line">
            <span class="meta-label">歌手</span>
            <span id="artistBlocks"></span>
        </div>
    </div>

    <div class="progress-wrap">
        <div class="progress-bg"><div class="progress-fg" id="progressFg" style="width:0%"></div></div>
        <div class="progress-text">已揭示 <b id="revCount">0</b> / <span id="totCount">0</span></div>
    </div>

    <div class="loading-wrap" id="loadingWrap">
        <div><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
        <div style="margin-top:12px;letter-spacing:1px;">LOADING…</div>
    </div>

    <div class="lyrics-area" id="lyricsArea"></div>
    <div class="footer-tip">GUESS CHARS → REVEAL LYRICS → WIN WHEN SONG NAME IS FULL</div>
</div>

<!-- 歌曲数据 -->
<script src="songs-data.js"></script>

<!-- 提示条 -->
<div class="toast" id="toast"></div>

<!-- 胜利弹窗 -->
<div class="overlay" id="overlay">
    <div class="win-box">
        <span class="win-emoji">🎉</span>
        <div class="win-title">SONG GUESSED!</div>
        <div class="win-song" id="wSong"></div>
        <div class="win-info" id="wArtist"></div>
        <div class="win-stats">
            <div class="win-stat-item">
                <div class="stat-num" id="wCount">0</div>
                <div class="stat-label">GUESSES</div>
            </div>
            <div class="win-stat-divider"></div>
            <div class="win-stat-item">
                <div class="stat-num" id="wTime">0s</div>
                <div class="stat-label">TIME</div>
            </div>
        </div>
        <div class="win-actions">
            <button class="back-theme-btn" onclick="goHome()">换专场</button>
            <button class="next-btn" onclick="nextSong()">再来一首 →</button>
        </div>
    </div>
</div>

<script>
/* ========== 初始预揭示的高频字 ========== */
const PRE_REVEAL = new Set(['的', '了', '是', '在', '着', '你', '我', '他']);

/* ========== 游戏状态 ========== */
let currentTheme   = null;
let currentSong    = null;
let usedSongNames  = {};
let guessCount     = 0;
let startTime      = 0;
let states         = [];
let songNameStates = [];
let artistStates   = [];
let guessedSet     = new Set();

/* ========== 动态渲染主题卡片 ========== */
(function renderThemeGrid() {
    const grid = document.getElementById('themeGrid');
    THEMES.forEach(t => {
        const count = (THEME_SONGS[t.id] || []).length;
        const card = document.createElement('div');
        card.className = 'theme-card';
        card.setAttribute('onclick', `selectTheme('${t.id}')`);
        card.innerHTML = `
            <span class="theme-card-icon">${t.icon}</span>
            <div class="theme-card-name">${t.name}</div>
            <div class="theme-card-desc">${t.desc}</div>
            <span class="theme-card-count">${count} 首</span>
        `;
        grid.appendChild(card);
    });
})();

/* ========== 接口层 ========== */
async function fetchSong(themeId) {
    const pool = THEME_SONGS[themeId] || [];
    if (!usedSongNames[themeId]) usedSongNames[themeId] = new Set();
    const used = usedSongNames[themeId];
    let available = pool.filter(s => !used.has(s.name));
    if (available.length === 0) { used.clear(); available = pool; }
    const song = available[Math.floor(Math.random() * available.length)];
    used.add(song.name);
    return song;
}

/* ========== 主题选择 ========== */
function selectTheme(themeId) {
    currentTheme = themeId;
    const theme  = THEMES.find(t => t.id === themeId);
    document.getElementById('themeScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display  = 'block';
    document.getElementById('themeBadge').textContent    = `${theme.icon} ${theme.name}`;
    usedSongNames[themeId] = new Set();
    startNewSong();
}

function goHome() {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('gameScreen').style.display  = 'none';
    document.getElementById('themeScreen').style.display = 'flex';
}

async function startNewSong() {
    document.getElementById('loadingWrap').style.display = 'block';
    document.getElementById('lyricsArea').innerHTML = '';
    currentSong = await fetchSong(currentTheme);
    document.getElementById('loadingWrap').style.display = 'none';
    initGame();
}

/* ========== 初始化 ========== */
function initGame() {
    const song = currentSong;
    guessCount = 0;
    startTime  = Date.now();
    guessedSet = new Set();
    states     = [];

    song.lyrics.forEach((line, li) => {
        states[li] = [...line].map(ch => PRE_REVEAL.has(ch) ? 'pre' : 'hidden');
        [...line].forEach(ch => { if (PRE_REVEAL.has(ch)) guessedSet.add(ch); });
    });

    renderSongMeta();
    renderLyrics();
    updateStats();
    document.getElementById('guessCount').textContent = 0;
    const inp = document.getElementById('guessInput');
    inp.value = '';
    inp.focus();
}

/* ---- 渲染歌名/歌手 ---- */
function renderSongMeta() {
    const song = currentSong;
    songNameStates = [...song.name].map(ch => PRE_REVEAL.has(ch) ? 'pre' : 'hidden');
    const nameEl = document.getElementById('songNameBlocks');
    nameEl.innerHTML = '';
    [...song.name].forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.id = `sn_${i}`;
        sp.className = songNameStates[i] === 'pre' ? 'ch pre meta-ch' : 'ch hidden meta-ch';
        if (songNameStates[i] === 'pre') sp.textContent = ch;
        nameEl.appendChild(sp);
    });

    artistStates = [...song.artist].map(ch =>
        (ch === '/' || ch === ' ') ? 'sep' : (PRE_REVEAL.has(ch) ? 'pre' : 'hidden')
    );
    const artEl = document.getElementById('artistBlocks');
    artEl.innerHTML = '';
    [...song.artist].forEach((ch, i) => {
        const sp = document.createElement('span');
        sp.id = `sa_${i}`;
        if (artistStates[i] === 'sep') {
            sp.className = 'meta-sep'; sp.textContent = ch;
        } else if (artistStates[i] === 'pre') {
            sp.className = 'ch pre meta-ch'; sp.textContent = ch;
        } else {
            sp.className = 'ch hidden meta-ch';
        }
        artEl.appendChild(sp);
    });
}

/* ---- 渲染歌词 ---- */
function renderLyrics() {
    const song = currentSong;
    const area = document.getElementById('lyricsArea');
    area.innerHTML = '';
    song.lyrics.forEach((line, li) => {
        const row = document.createElement('div');
        row.className = 'lyric-line';
        [...line].forEach((ch, ci) => {
            const sp = document.createElement('span');
            sp.id = `c${li}_${ci}`;
            sp.className = `ch ${states[li][ci]}`;
            if (states[li][ci] !== 'hidden') sp.textContent = ch;
            row.appendChild(sp);
        });
        area.appendChild(row);
    });
}

/* ---- 更新进度 ---- */
function updateStats() {
    const song = currentSong;
    let total = 0, revealed = 0;
    song.lyrics.forEach((line, li) => {
        [...line].forEach((_, ci) => {
            total++;
            if (states[li][ci] !== 'hidden') revealed++;
        });
    });
    document.getElementById('totCount').textContent = total;
    document.getElementById('revCount').textContent = revealed;
    document.getElementById('progressFg').style.width = (revealed / total * 100).toFixed(1) + '%';
}

/* ========== 处理猜测 ========== */
function handleGuess() {
    const inp = document.getElementById('guessInput');
    const val = inp.value.trim();
    if (!val) return;

    guessCount++;
    document.getElementById('guessCount').textContent = guessCount;

    const chars = [...val].filter(c => /[一-龥a-zA-Z0-9]/.test(c));
    if (chars.length > 0) {
        const unique = [...new Set(chars)];
        const hitChars = [], missChars = [], skipChars = [];

        unique.forEach(ch => {
            if (guessedSet.has(ch)) { skipChars.push(ch); return; }
            const result = revealChar(ch, true);
            if (result === 'hit')  hitChars.push(ch);
            if (result === 'miss') missChars.push(ch);
        });

        updateStats();

        if (hitChars.length > 0 && missChars.length === 0) {
            showToast(`命中：${hitChars.map(c => `"${c}"`).join(' ')} ✓`, 'ok');
        } else if (hitChars.length > 0) {
            showToast(`命中 ${hitChars.join('')}，未找到 ${missChars.join('')}`, 'tip');
        } else if (skipChars.length === unique.length) {
            showToast('这些字都猜过了', 'tip');
        } else {
            showToast(`歌词中没有 "${missChars.join('')}"`, 'err');
        }

        inp.value = '';
        checkSongNameRevealed();
        return;
    }

    inp.classList.add('shake');
    setTimeout(() => inp.classList.remove('shake'), 400);
    showToast('请输入有效字符', 'err');
    inp.value = '';
}

/* ---- 检查歌名是否全部揭示 ---- */
function checkSongNameRevealed() {
    if (songNameStates.every(s => s !== 'hidden')) triggerWin();
}

/* ---- 揭示字符 ---- */
function revealChar(ch, silent = false) {
    if (guessedSet.has(ch)) {
        if (!silent) showToast(`"${ch}" 已经猜过了`, 'tip');
        return 'skip';
    }
    guessedSet.add(ch);

    const song = currentSong;
    let found = false;

    song.lyrics.forEach((line, li) => {
        [...line].forEach((c, ci) => {
            if (c === ch && states[li][ci] === 'hidden') {
                states[li][ci] = 'revealed'; found = true;
                const el = document.getElementById(`c${li}_${ci}`);
                if (el) { el.className = 'ch revealed'; el.textContent = ch; }
            }
        });
    });
    [...song.name].forEach((c, i) => {
        if (c === ch && songNameStates[i] === 'hidden') {
            songNameStates[i] = 'revealed'; found = true;
            const el = document.getElementById(`sn_${i}`);
            if (el) { el.className = 'ch revealed meta-ch'; el.textContent = ch; }
        }
    });
    [...song.artist].forEach((c, i) => {
        if (c === ch && artistStates[i] === 'hidden') {
            artistStates[i] = 'revealed'; found = true;
            const el = document.getElementById(`sa_${i}`);
            if (el) { el.className = 'ch revealed meta-ch'; el.textContent = ch; }
        }
    });

    if (!silent) {
        updateStats();
        showToast(found ? `找到了 "${ch}"！` : `歌词中没有 "${ch}"`, found ? 'ok' : 'err');
    }
    return found ? 'hit' : 'miss';
}

/* ---- 提示按钮 ---- */
function useHint() {
    const song = currentSong;
    const pool = [];
    song.lyrics.forEach((line, li) => {
        [...line].forEach((ch, ci) => {
            if (states[li][ci] === 'hidden' && !guessedSet.has(ch)) pool.push(ch);
        });
    });
    [...song.name].forEach((ch, i)   => { if (songNameStates[i] === 'hidden' && !guessedSet.has(ch)) pool.push(ch); });
    [...song.artist].forEach((ch, i) => { if (artistStates[i]   === 'hidden' && !guessedSet.has(ch)) pool.push(ch); });

    if (pool.length === 0) { showToast('所有字都已揭示！', 'tip'); return; }

    guessCount += 2;
    document.getElementById('guessCount').textContent = guessCount;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    revealChar(pick);
    showToast(`提示：揭示了"${pick}"（+2次猜测）`, 'tip');
    checkSongNameRevealed();
}

/* ---- 胜利 ---- */
function triggerWin() {
    const song = currentSong;
    song.lyrics.forEach((line, li) => {
        [...line].forEach((ch, ci) => {
            if (states[li][ci] === 'hidden') {
                states[li][ci] = 'revealed';
                const el = document.getElementById(`c${li}_${ci}`);
                if (el) { el.className = 'ch revealed'; el.textContent = ch; }
            }
        });
    });
    [...song.name].forEach((ch, i) => {
        if (songNameStates[i] === 'hidden') {
            songNameStates[i] = 'revealed';
            const el = document.getElementById(`sn_${i}`);
            if (el) { el.className = 'ch revealed meta-ch'; el.textContent = ch; }
        }
    });
    [...song.artist].forEach((ch, i) => {
        if (artistStates[i] === 'hidden') {
            artistStates[i] = 'revealed';
            const el = document.getElementById(`sa_${i}`);
            if (el) { el.className = 'ch revealed meta-ch'; el.textContent = ch; }
        }
    });

    updateStats();

    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById('wSong').textContent    = song.name;
    document.getElementById('wArtist').textContent  = '演唱：' + song.artist;
    document.getElementById('wCount').textContent   = guessCount;
    document.getElementById('wTime').textContent    = elapsed >= 60
        ? `${Math.floor(elapsed / 60)}m${elapsed % 60}s` : `${elapsed}s`;
    document.getElementById('overlay').classList.add('show');
}

/* ---- 下一首 ---- */
function nextSong() {
    document.getElementById('overlay').classList.remove('show');
    startNewSong();
}

/* ---- Toast ---- */
let _toastTimer = null;
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type}`;
    t.style.display = 'block';
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2000);
}

document.getElementById('guessInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleGuess();
});
</script>
</body>
</html>
